name: Deploy to production

# STORY-012 (REQ-025/REQ-026): the reproducible pipeline this repo's production
# instance actually runs through, with no manual `fly deploy` from a laptop.
# The full test suite is a hard gate: a red build never reaches production, and
# never gets an image pushed at all.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Existing image tag to redeploy without rebuilding (a rollback: the
          git SHA of the last known-good build). Leave empty for a normal
          build-and-deploy of the current commit.
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    if: ${{ github.event.inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: "mcp-server: install"
        working-directory: mcp-server
        run: npm ci

      - name: "mcp-server: typecheck"
        working-directory: mcp-server
        run: npx tsc --noEmit

      - name: "mcp-server: test"
        working-directory: mcp-server
        run: npm test

      - name: "guardrails: install"
        working-directory: guardrails
        run: npm ci

      - name: "guardrails: test"
        working-directory: guardrails
        run: npm test

      - name: "frontend: install"
        working-directory: frontend
        run: npm ci

      - name: "frontend: test"
        working-directory: frontend
        run: npm test

      - name: "frontend: build"
        working-directory: frontend
        run: npm run build

  build-and-push:
    needs: [test]
    if: ${{ always() && github.event.inputs.image_tag == '' && (needs.test.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: [build-and-push]
    if: ${{ always() && !cancelled() && (needs.build-and-push.result == 'success' || github.event.inputs.image_tag != '') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      # flyctl deploy reads fly.toml from the working directory; without this
      # checkout the deploy job has an empty workspace and flyctl fails with
      # "the config for your app is missing an app name" even though fly.toml
      # has one, because there is no fly.toml here at all without this step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Captured before attempting the new deploy, not derived afterward --
      # whatever is running right now is by definition the last version that
      # passed its own health check, so it is the correct auto-rollback
      # target if the new deploy below fails. `fly image show` reads the app
      # name from fly.toml, same as the deploy step, so there is no
      # hardcoded app name to drift out of sync.
      - name: Capture currently-running image (auto-rollback target)
        id: previous
        run: |
          TAG=$(flyctl image show --json | jq -r '.[0].Tag // empty')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Resolve image tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ needs.build-and-push.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      # Deploys a pinned, already-built image by reference, the same command
      # for a normal deploy and a manual rollback (docs/DEPLOYMENT.md), so
      # there is exactly one deploy code path to trust.
      # rolling, not bluegreen: bluegreen needs two machines to simultaneously
      # claim the same Fly volume, which Fly does not support -- confirmed live,
      # `flyctl deploy --strategy bluegreen` on this app fails outright with
      # "failed_precondition: volume already claimed", every time, not
      # intermittently. This is a hard platform constraint (bluegreen and
      # canary both refuse to run against a volume-mounted app), not a bug to
      # route around, so bluegreen was never viable here once ADR-005's audit
      # trail volume existed. rolling still waits for fly.toml's
      # [[http_service.checks]] (GET /health) to pass before completing the
      # release, and fails the deploy (leaving the prior image's release as
      # the last successful one) if it doesn't -- but because this app runs a
      # single machine (min_machines_running = 1), rolling tears the old
      # machine down before the new one is confirmed healthy, so there is a
      # real, brief window of unavailability during every deploy that
      # bluegreen's overlap would have avoided. Documented honestly rather
      # than silently narrowing what "health-gated" means for this app.
      - name: Deploy new image
        id: deploy_new
        run: >
          flyctl deploy
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.tag }}
          --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Automates the one human action the operator used to have to perform
      # by hand after being paged: redeploy the last known-good image. Only
      # attempted once -- if this also fails, no further automatic retries
      # (an unbounded auto-rollback loop is its own incident), the page below
      # escalates instead. Skipped if there was no previous image to roll
      # back to (e.g. the very first deploy of a brand-new app).
      - name: Auto-rollback to the previous image
        id: auto_rollback
        if: failure() && steps.deploy_new.outcome == 'failure' && steps.previous.outputs.tag != ''
        run: >
          flyctl deploy
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.previous.outputs.tag }}
          --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # INCIDENT-DRILL-001's recommendation, closed: the drill found that a
      # failed rolling deploy leaves the broken machine running and
      # unreachable indefinitely with nobody paged -- "brief window of
      # unavailability" only held because the operator happened to be
      # watching. This step is that page. Reuses the exact channel
      # notifyOperators() already uses for in-app autonomous actions (ntfy.sh,
      # same NTFY_TOPIC value, also stored as a GitHub Actions secret since
      # this runs in CI, outside the app process). `if: failure()` fires
      # whenever any earlier step in this job failed -- a healthy deploy
      # sends nothing.
      #
      # Previously built and reverted (2026-09-17, commit 8c21a3d -> ea93b60)
      # because the NTFY_TOPIC Actions secret had never actually been set.
      # Re-applied 2026-10-01 (INCIDENT-002) with the secret actually set
      # first, verified end to end with a real failing deploy. Extended the
      # same day to report auto-rollback's own outcome (see
      # docs/INCIDENT-DRILL-001.md's addendum) rather than always telling the
      # operator to run a command that auto-rollback may have already run.
      - name: Page operator on deploy failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          ROLLBACK_OUTCOME: ${{ steps.auto_rollback.outcome }}
        run: |
          if [ "${ROLLBACK_OUTCOME}" = "success" ]; then
            MESSAGE="flyctl deploy failed for image tag ${IMAGE_TAG} on ${{ github.repository }}, and was auto-rolled-back to the previous image (${PREVIOUS_TAG}), which is now live again.
            Run: ${RUN_URL}
            Your latest commit is NOT live -- confirm with: curl -sf https://coreops.fly.dev/health/dependencies
            Fix the build, then re-push to retry."
          else
            MESSAGE="URGENT: flyctl deploy failed for image tag ${IMAGE_TAG} on ${{ github.repository }}, AND auto-rollback to ${PREVIOUS_TAG} also failed (or had nothing to roll back to). No automatic recovery happened -- manual intervention required now.
            Run: ${RUN_URL}
            Roll back per docs/DEPLOYMENT.md: gh workflow run deploy.yml --ref main -f image_tag=<last-known-good-sha>"
          fi
          curl -sf -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: CoreOps: deploy_failed" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            --data-binary "${MESSAGE}"
