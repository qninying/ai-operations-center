<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('coreops-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
</script>
<title>CoreOps — Data Model</title>
<link rel="stylesheet" href="assets/command-center.css?v=2" />
</head>
<body>
  <header class="cc-header">
    <div class="cc-header-top">
      <div class="cc-brand">CoreOps Command Center</div>
      <div class="cc-mode-toggle" id="cc-mode-toggle"></div>
      <button class="cc-theme-toggle" id="cc-theme-toggle" aria-label="Switch between day and night theme" title="Day / Night"></button>
    </div>
    <div class="cc-data-as-of" id="cc-data-as-of">Loading…</div>
    <nav class="cc-nav" id="cc-nav"></nav>
  </header>
  <main id="cc-main">
    <h1 class="cc-page-title">Data Model</h1>
    <p class="cc-page-desc">A starting point, not the answer — derived from what the requirements say has to be stored, named for this domain rather than any vendor.</p>
    <div id="cc-content">Loading…</div>
  </main>
  <script src="assets/command-center.js?v=4"></script>
  <script>
  (function () {
    const { esc, getParam } = CommandCenter;

    const ENTITIES = [
      { name: "Requirement", from: "REQ-*", fields: ["id", "statement", "kind (FUNC/SAFE/CONSTRAINT/NFR)", "priority (must/should)"], relates: "fulfilled by many Story" },
      { name: "Story", from: "STORY-*", fields: ["id", "title", "narrative", "release_key", "due_on", "due_baseline_on"], relates: "fulfils many Requirement; has many AcceptanceCriterion; has one VerificationRecord" },
      { name: "Release", from: "plan.releases", fields: ["key", "name", "starts_on", "ends_on", "is_demo_target"], relates: "has many Story" },
      { name: "AcceptanceCriterion", from: "Done means / progress.stories[].criteria", fields: ["story_id", "text", "passed"], relates: "belongs to one Story" },
      { name: "VerificationRecord", from: "progress.stories[].verification", fields: ["story_id", "state", "commit_sha", "verified_at"], relates: "belongs to one Story" },
      { name: "MonitoredSystem", from: "REQ-007 (SQL Server, SSIS, SSRS, Windows)", fields: ["name", "connection_status", "last_checked_at"], relates: "referenced by many Recommendation" },
      { name: "Connector", from: "REQ-008, REQ-018 (plug-in architecture)", fields: ["name", "target_system", "status"], relates: "extends MonitoredSystem" },
      { name: "IncidentRecommendation", from: "REQ-002, REQ-003, REQ-004, REQ-013", fields: ["id", "confidence_score", "evidence", "recommended_action", "created_at"], relates: "has one ApprovalRecord; may have one Escalation" },
      { name: "ApprovalRecord", from: "REQ-001", fields: ["recommendation_id", "approver", "decision", "decided_at"], relates: "belongs to one IncidentRecommendation" },
      { name: "AuditLogEntry", from: "REQ-005", fields: ["actor", "action", "target", "occurred_at"], relates: "references any entity by id" },
      { name: "Escalation", from: "REQ-010, REQ-011", fields: ["recommendation_id", "reason", "escalated_to", "occurred_at"], relates: "belongs to one IncidentRecommendation" },
      { name: "OperatorNotification", from: "REQ-012", fields: ["recommendation_id", "operator", "sent_at"], relates: "belongs to one IncidentRecommendation" },
      { name: "RollbackRecord", from: "REQ-015", fields: ["recommendation_id", "initiated_by", "occurred_at", "outcome"], relates: "belongs to one IncidentRecommendation" },
      { name: "StoryOwner", from: "plan.derived.owners", fields: ["name", "story_ids[]"], relates: "owns many Story" },
    ];

    function renderList() {
      const el = document.getElementById("cc-content");
      el.innerHTML = `<div class="cc-grid">` + ENTITIES.map((e) => `
        <a class="cc-card" href="data-model.html?id=${encodeURIComponent(e.name)}">
          <h3>${esc(e.name)}</h3>
          <p>${esc(e.from)}</p>
        </a>
      `).join("") + `</div>`;
    }

    function renderDetail(id) {
      const el = document.getElementById("cc-content");
      const e = ENTITIES.find((x) => x.name === id);
      if (!e) {
        el.innerHTML = `<div class="cc-empty-state">No entity "${esc(id)}" in this model.</div>`;
        return;
      }
      el.innerHTML = `
        <p><a href="data-model.html">← Data Model</a></p>
        <div class="cc-panel-box">
          <h3 style="margin-top:0;">${esc(e.name)}</h3>
          <p style="color:var(--cc-muted); font-size:13px;">Derived from: ${esc(e.from)}</p>
          <p style="font-size:13px;"><strong>Fields:</strong></p>
          <ul>${e.fields.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
          <p style="font-size:13px;"><strong>Relationships:</strong> ${esc(e.relates)}</p>
        </div>
      `;
    }

    CommandCenter.init("data-model", () => {
      const id = getParam("id");
      if (id) renderDetail(id);
      else renderList();
    });
  })();
  </script>
</body>
</html>
