<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('coreops-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
</script>
<title>CoreOps — AI Agents</title>
<link rel="stylesheet" href="assets/command-center.css?v=4" />
</head>
<body>
  <header class="cc-header">
    <div class="cc-header-top">
      <div class="cc-brand">CoreOps Command Center</div>
      <div class="cc-mode-toggle" id="cc-mode-toggle"></div>
      <button class="cc-theme-toggle" id="cc-theme-toggle" aria-label="Switch between day and night theme" title="Day / Night"></button>
    </div>
    <div class="cc-data-as-of" id="cc-data-as-of">Loading…</div>
    <nav class="cc-nav" id="cc-nav"></nav>
  </header>
  <main id="cc-main">
    <h1 class="cc-page-title">AI Agents</h1>
    <p class="cc-page-desc">What the code actually contains: the AI agents that call Claude, and the MCP tools other agents can call. Generated from the repo by <code>npm run inventory</code>, so it can't drift from the build. Story owners from the plan are listed below.</p>
    <div id="cc-content">Loading…</div>
  </main>
  <script src="assets/command-center.js?v=9"></script>
  <script>
  (function () {
    const { esc, getParam } = CommandCenter;

    // Sample overlay only. Real mode always says "no skills registered yet" /
    // "no runs recorded" — never a fabricated success rate, per the brief.
    const SAMPLE_SKILLS = {
      "DBA": ["query-performance-diagnosis", "index-health-check"],
      "DevOps": ["deploy-pipeline-monitor"],
      "System": ["incident-correlation"],
    };

    function renderRepoSection(inventory) {
      if (!inventory) {
        return `<div class="cc-empty-state">No repo inventory yet. Run <code>npm run inventory</code> in mcp-server/ to generate command-center/data/repo-inventory.json.</div>`;
      }
      const asOf = new Date(inventory.generated_at).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" });
      const agents = inventory.agents || [];
      const tools = inventory.mcp_tools || [];
      return `
        <p style="color:var(--cc-muted); font-size:13px;">From the code at commit ${esc(inventory.git_sha || "unknown")}, generated ${esc(asOf)}. This says what exists in the repo, not whether it is running right now.</p>
        <h2 class="cc-section-title">AI agents in the code (${agents.length})</h2>
        <div class="cc-grid">` + (agents.length ? agents.map((a) => `
          <div class="cc-card">
            <h3>${esc(a.name)}</h3>
            <p>${esc(a.description || "No description comment in the file.")}</p>
            <p style="margin-top:8px; color: var(--cc-muted); font-size:12px;"><code>${esc(a.file)}</code> · ${a.has_tests ? "has tests" : "no test file"} · calls Claude</p>
          </div>`).join("") : `<div class="cc-empty-state">No file in mcp-server/src calls Claude.</div>`) + `</div>
        <h2 class="cc-section-title">MCP tools other agents can call (${tools.length})</h2>
        <table class="cc-table">
          <thead><tr><th>Tool</th><th>What it does</th><th>Defined in</th></tr></thead>
          <tbody>${tools.map((tl) => `<tr><td><code>${esc(tl.name)}</code></td><td>${esc(tl.title)}</td><td><code>${esc(tl.file)}</code></td></tr>`).join("")}</tbody>
        </table>`;
    }

    function renderList({ plan, mode, inventory }) {
      const el = document.getElementById("cc-content");
      const owners = CommandCenter.storyOwners(plan);
      const badge = CommandCenter.sampleBadge();
      el.innerHTML = renderRepoSection(inventory) + `
        <h2 class="cc-section-title">Story owners from the plan</h2>
        ` + (owners.length ? `<div class="cc-banner">These are the people or roles who own stories in the plan. They are owners, not AI agents.</div>` : `<div class="cc-empty-state">The plan doesn't list story owners.</div>`) + `
        <div class="cc-grid">` + owners.map((o) => {
          const skills = mode === "sample" ? (SAMPLE_SKILLS[o.name] || []) : [];
          const skillsText = mode === "sample"
            ? (skills.length ? skills.join(", ") : "no skills registered yet")
            : "no skills registered yet";
          return `
          <a class="cc-card" href="agents.html?id=${encodeURIComponent(o.name)}">
            <h3>${esc(o.name)}${badge}</h3>
            <p>Owns ${o.owns.length} ${o.owns.length === 1 ? "story" : "stories"}: ${o.owns.map(esc).join(", ")}</p>
            <p style="margin-top:8px; color: var(--cc-muted);">${esc(skillsText)}</p>
          </a>
        `;
        }).join("") + `</div>`;
    }

    function renderDetail({ plan, progress, mode }, id) {
      const el = document.getElementById("cc-content");
      const owners = CommandCenter.storyOwners(plan);
      const owner = owners.find((o) => o.name === id);
      if (!owner) {
        el.innerHTML = `<div class="cc-empty-state">No owner "${esc(id)}" in the plan.</div>`;
        return;
      }
      const badge = CommandCenter.sampleBadge();
      const skills = mode === "sample" ? (SAMPLE_SKILLS[owner.name] || []) : [];
      const skillsText = skills.length ? skills.join(", ") : "no skills registered yet";
      const runsText = mode === "sample" && skills.length ? "14 runs recorded, last 3 hours ago" : "no runs recorded";
      const stories = owner.owns.map((sid) => (plan.stories || []).find((s) => s.id === sid)).filter(Boolean);
      el.innerHTML = `
        <p><a href="agents.html">← AI Agents</a></p>
        <div class="cc-panel-box">
          <h3 style="margin-top:0;">${esc(owner.name)}${badge}</h3>
          <p style="color:var(--cc-muted); font-size:13px;">Owner, not a scoped AI agent. Skills: ${esc(skillsText)}. Runs: ${esc(runsText)}.</p>
          <table class="cc-table">
            <thead><tr><th>Story</th><th>Title</th><th>Status</th></tr></thead>
            <tbody>
              ${stories.map((s) => {
                const state = ((progress && progress.stories) || []).find((p) => p.id === s.id);
                return `<tr><td><a href="project-management.html?id=${encodeURIComponent(s.id)}">${esc(s.id)}</a></td><td>${esc(s.title)}</td><td>${CommandCenter.statusDot(state ? state.verification.state : "not_started")}${esc(state ? state.verification.state : "not_started")}</td></tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    CommandCenter.init("agents", (data) => {
      const id = getParam("id");
      if (id) renderDetail(data, id);
      else renderList(data);
    });
  })();
  </script>
</body>
</html>
