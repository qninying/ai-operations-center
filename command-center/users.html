<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('coreops-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
</script>
<title>CoreOps — Users & Use Case</title>
<link rel="stylesheet" href="assets/command-center.css?v=2" />
</head>
<body>
  <header class="cc-header">
    <div class="cc-header-top">
      <div class="cc-brand">CoreOps Command Center</div>
      <div class="cc-mode-toggle" id="cc-mode-toggle"></div>
      <button class="cc-theme-toggle" id="cc-theme-toggle" aria-label="Switch between day and night theme" title="Day / Night"></button>
    </div>
    <div class="cc-data-as-of" id="cc-data-as-of">Loading…</div>
    <nav class="cc-nav" id="cc-nav"></nav>
  </header>
  <main id="cc-main">
    <h1 class="cc-page-title">Users &amp; Use Case</h1>
    <p class="cc-page-desc">Who this is for, and what they're trying to get done — taken from the "As a &lt;role&gt;" line in each story.</p>
    <div id="cc-content">Loading…</div>
  </main>
  <script src="assets/command-center.js?v=4"></script>
  <script>
  (function () {
    const { esc, getParam } = CommandCenter;

    function storiesForRole(plan, role) {
      return (plan.stories || []).filter((s) => s.narrative && s.narrative.startsWith(`As a${role.match(/^[AEIOU]/) ? "n" : ""} ${role}`));
    }

    function renderList({ plan }) {
      const el = document.getElementById("cc-content");
      const roles = (plan.derived && plan.derived.roles) || [];
      el.innerHTML = `<div class="cc-grid">` + roles.map((role) => {
        const stories = storiesForRole(plan, role);
        return `
          <a class="cc-card" href="users.html?id=${encodeURIComponent(role)}">
            <h3>${esc(role)}</h3>
            <p>${stories.length} ${stories.length === 1 ? "story" : "stories"}</p>
          </a>
        `;
      }).join("") + `</div>`;
    }

    function renderDetail({ plan }, role) {
      const el = document.getElementById("cc-content");
      const stories = storiesForRole(plan, role);
      el.innerHTML = `
        <p><a href="users.html">← Users & Use Case</a></p>
        <div class="cc-panel-box">
          <h3 style="margin-top:0;">${esc(role)}</h3>
          ${stories.length === 0
            ? `<p style="color:var(--cc-muted);">No story currently carries this role's narrative.</p>`
            : stories.map((s) => `
                <p style="margin:0 0 12px;">
                  <strong>${esc(s.id)}</strong> — ${esc(s.title)}<br/>
                  <span style="color:var(--cc-muted); font-size:13px;">${esc(s.narrative)}</span>
                </p>
              `).join("")}
        </div>
      `;
    }

    CommandCenter.init("users", (data) => {
      const id = getParam("id");
      if (id) renderDetail(data, id);
      else renderList(data);
    });
  })();
  </script>
</body>
</html>
