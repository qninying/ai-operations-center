<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoreOps — Sign in</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0b0d;
    --bg-elevated: #131418;
    --border: #23252b;
    --border-strong: #2f323a;
    --text: #eef0f3;
    --text-secondary: #9198a6;
    --accent: #5b8cff;
    --danger: #f0576b;
    --danger-dim: #3a1a20;
    --radius-md: 10px;
    --radius-sm: 7px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 340px; padding: 32px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #06122b; flex-shrink: 0;
  }
  .brand-text { font-weight: 600; font-size: 14px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 20px; }
  label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
  input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm); padding: 9px 11px;
    font-size: 13.5px; font-family: inherit; margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; background: var(--accent); color: #06122b; border: none;
    border-radius: var(--radius-sm); padding: 10px; font-size: 13.5px;
    font-weight: 600; font-family: inherit; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    display: none; background: var(--danger-dim); color: #ffb3bd;
    border-radius: var(--radius-sm); padding: 9px 11px; font-size: 12.5px;
    margin-bottom: 16px;
  }
  .error.shown { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div class="brand-text">CoreOps</div>
    </div>
    <h1>Sign in</h1>
    <div class="error" id="error"></div>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" />
      <label for="totpCode">Authentication code</label>
      <input type="text" id="totpCode" name="totpCode" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" />
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.className = 'error';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            totpCode: document.getElementById('totpCode').value,
          }),
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        const body = await res.json().catch(() => ({}));
        errorEl.textContent = body.message || 'Sign in failed.';
        errorEl.className = 'error shown';
      } catch (err) {
        errorEl.textContent = 'Request failed: ' + err.message;
        errorEl.className = 'error shown';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
