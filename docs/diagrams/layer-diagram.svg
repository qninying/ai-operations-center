<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" role="img" aria-label="A six-layer pipeline runs from Data and Infrastructure up through Integration, Reasoning, and Orchestration to a Governance gate, which requires approval from a human at the Application layer before an approved action executes back down to Orchestration. A seventh layer, Observability and Audit, connects to every layer in the pipeline via one shared correlation ID.">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
          <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#3d5fe0"/>
          </marker>
        </defs>

        <!-- ============ main pipeline column — boxes at consistent 56px gaps ============ -->
        <!-- Application (top): y 30-94 -->
        <rect x="60" y="30" width="380" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="82" y="56" font-size="10" letter-spacing="1" fill="#88909c">01 · APPLICATION / INTERACTION</text>
        <text x="82" y="78" font-size="14" class="label-title">Dashboard &amp; Console — a human sees state</text>

        <!-- Application(94) <-> Governance(150) -->
        <line x1="200" y1="94" x2="200" y2="150" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="212" y="126" font-size="10.5" fill="#565f6c">approve / reject</text>

        <line x1="300" y1="150" x2="300" y2="94" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="312" y="126" font-size="10.5" fill="#565f6c">awaiting approval</text>

        <!-- Governance (distinct: thicker border): y 150-220 -->
        <rect x="60" y="150" width="380" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>
        <text x="82" y="176" font-size="10" letter-spacing="1" fill="#88909c">02 · GOVERNANCE &amp; GUARDRAIL</text>
        <text x="82" y="198" font-size="14" class="label-title">The gate — evidence + type + real approval, or it fails</text>

        <!-- Governance(220) <-> Orchestration(276) -->
        <line x1="150" y1="220" x2="150" y2="276" stroke="#3d5fe0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
        <text x="162" y="252" font-size="10.5" fill="#3d5fe0">approved → execute</text>

        <line x1="350" y1="276" x2="350" y2="220" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="362" y="252" font-size="10.5" fill="#565f6c">proposes action</text>

        <!-- Orchestration: y 276-340 -->
        <rect x="60" y="276" width="380" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="82" y="302" font-size="10" letter-spacing="1" fill="#88909c">03 · ORCHESTRATION</text>
        <text x="82" y="324" font-size="14" class="label-title">Sequences detection → reasoning → escalation</text>

        <line x1="250" y1="340" x2="250" y2="396" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="262" y="372" font-size="10.5" fill="#565f6c">recommendation + confidence</text>

        <!-- Reasoning: y 396-460 -->
        <rect x="60" y="396" width="380" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="82" y="422" font-size="10" letter-spacing="1" fill="#88909c">04 · REASONING / MODEL</text>
        <text x="82" y="444" font-size="14" class="label-title">A real model call over real evidence</text>

        <line x1="250" y1="460" x2="250" y2="516" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="262" y="492" font-size="10.5" fill="#565f6c">evidence rows</text>

        <!-- Integration: y 516-580 -->
        <rect x="60" y="516" width="380" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="82" y="542" font-size="10" letter-spacing="1" fill="#88909c">05 · DATA INTEGRATION / TOOLING</text>
        <text x="82" y="564" font-size="14" class="label-title">Parameterized query — the first trust boundary</text>

        <line x1="250" y1="580" x2="250" y2="636" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="262" y="612" font-size="10.5" fill="#565f6c">reads, honestly tagged</text>

        <!-- Data & Infrastructure: y 636-700 -->
        <rect x="60" y="636" width="380" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="82" y="662" font-size="10" letter-spacing="1" fill="#88909c">06 · DATA &amp; INFRASTRUCTURE</text>
        <text x="82" y="684" font-size="14" class="label-title">The system of record — SQL Server, Blob Storage</text>

        <!-- ============ side: Observability & Audit — spans Governance top to Data&Infra bottom (150-700) ============ -->
        <rect x="560" y="150" width="240" height="550" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="580" y="178" font-size="10" letter-spacing="1" fill="#88909c">07 · OBSERVABILITY</text>
        <text x="580" y="192" font-size="10" letter-spacing="1" fill="#88909c">&amp; AUDIT</text>
        <text x="580" y="220" font-size="14" class="label-title">One correlation ID,</text>
        <text x="580" y="240" font-size="14" class="label-title">every hop</text>
        <text x="580" y="270" font-size="11" fill="#565f6c">Reconstructs the full</text>
        <text x="580" y="288" font-size="11" fill="#565f6c">story after the fact —</text>
        <text x="580" y="306" font-size="11" fill="#565f6c">not just each step</text>
        <text x="580" y="324" font-size="11" fill="#565f6c">in isolation.</text>

        <!-- connectors from each main-pipeline box's vertical center to the audit column, same style repeated once -->
        <line x1="440" y1="185" x2="560" y2="185" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="440" y1="308" x2="560" y2="308" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="440" y1="428" x2="560" y2="428" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="440" y1="548" x2="560" y2="548" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="440" y1="668" x2="560" y2="668" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
      </svg>
