<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-label="Data flows left to right from external sources — Azure SQL, the Claude API, and ntfy.sh — through a validating gateway and reasoning step, into the application where an operator views it, through a guardrail that requires the operator's real approval, to an orchestration step that executes the one real reversible action. Three vertical boundaries mark where trust changes along this path: an external-service boundary after the sources, a render boundary after reasoning, and an action boundary before execution. A fourth, identity boundary sits between the operator and the application, crossed only by a verified login. An observability and audit layer beneath the flow taps every stage with one shared correlation ID.">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
        </defs>

        <!-- ============ operator (top) ============ -->
        <rect x="460" y="30" width="220" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="480" y="55" font-size="10" letter-spacing="1" fill="#88909c">OPERATOR</text>
        <text x="480" y="76" font-size="12.5" class="box-title">A real person, browser-side</text>

        <!-- identity boundary: horizontal dashed line just below operator -->
        <line x1="460" y1="108" x2="680" y2="108" stroke="#c23b3b" stroke-width="1.6" stroke-dasharray="6 4"/>
        <text x="686" y="112" font-size="10.5" fill="#c23b3b">IDENTITY BOUNDARY</text>

        <!-- operator -> Application (view) -->
        <line x1="540" y1="108" x2="540" y2="280" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="360" y="200" font-size="10.5" fill="#565f6c">views recommendation</text>

        <!-- operator -> Guardrail (approve/reject), angled -->
        <line x1="650" y1="108" x2="760" y2="280" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="765" y="200" font-size="10.5" fill="#565f6c">approve / reject</text>

        <!-- ============ main horizontal flow, y 280-360 ============ -->
        <!-- Box 1: External Sources, x 20-180 -->
        <rect x="20" y="280" width="160" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="36" y="302" font-size="10" letter-spacing="1" fill="#88909c">EXTERNAL SOURCES</text>
        <text x="36" y="320" font-size="11" fill="#565f6c">Azure SQL Database</text>
        <text x="36" y="335" font-size="11" fill="#565f6c">Anthropic Claude API</text>
        <text x="36" y="350" font-size="11" fill="#565f6c">ntfy.sh push</text>

        <!-- arrow box1 -> box2 -->
        <line x1="180" y1="320" x2="240" y2="320" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Boundary A: External-Service Boundary, x=210 -->
        <line x1="210" y1="250" x2="210" y2="400" stroke="#c23b3b" stroke-width="1.6" stroke-dasharray="6 4"/>
        <text x="210" y="238" font-size="9.5" text-anchor="middle" fill="#c23b3b">EXTERNAL-SERVICE</text>
        <text x="210" y="225" font-size="9.5" text-anchor="middle" fill="#c23b3b">BOUNDARY</text>

        <!-- Box 2: Gateway & Reasoning, x 240-400 -->
        <rect x="240" y="280" width="160" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="256" y="302" font-size="10" letter-spacing="1" fill="#88909c">GATEWAY &amp; REASONING</text>
        <text x="256" y="322" font-size="11" fill="#565f6c">Parameterized query,</text>
        <text x="256" y="337" font-size="11" fill="#565f6c">schema-checked → real</text>
        <text x="256" y="352" font-size="11" fill="#565f6c">Claude call, confidence</text>

        <line x1="400" y1="320" x2="460" y2="320" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Boundary B: Render Boundary, x=430 -->
        <line x1="430" y1="250" x2="430" y2="400" stroke="#c23b3b" stroke-width="1.6" stroke-dasharray="6 4"/>
        <text x="430" y="238" font-size="9.5" text-anchor="middle" fill="#c23b3b">RENDER</text>
        <text x="430" y="225" font-size="9.5" text-anchor="middle" fill="#c23b3b">BOUNDARY</text>

        <!-- Box 3: Application, x 460-620 -->
        <rect x="460" y="280" width="160" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="476" y="302" font-size="10" letter-spacing="1" fill="#88909c">APPLICATION</text>
        <text x="476" y="322" font-size="11" fill="#565f6c">Dashboard &amp; Console</text>
        <text x="476" y="337" font-size="11" fill="#565f6c">show the recommendation</text>
        <text x="476" y="352" font-size="11" fill="#565f6c">as text, not markup</text>

        <line x1="620" y1="320" x2="680" y2="320" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Boundary C: Action Boundary, x=650 -->
        <line x1="650" y1="250" x2="650" y2="400" stroke="#c23b3b" stroke-width="1.6" stroke-dasharray="6 4"/>
        <text x="650" y="238" font-size="9.5" text-anchor="middle" fill="#c23b3b">ACTION</text>
        <text x="650" y="225" font-size="9.5" text-anchor="middle" fill="#c23b3b">BOUNDARY</text>

        <!-- Box 4: Guardrail, x 680-840 -->
        <rect x="680" y="280" width="160" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>
        <text x="696" y="302" font-size="10" letter-spacing="1" fill="#88909c">GUARDRAIL</text>
        <text x="696" y="322" font-size="11" fill="#565f6c">Evidence + type +</text>
        <text x="696" y="337" font-size="11" fill="#565f6c">real approval —</text>
        <text x="696" y="352" font-size="11" fill="#565f6c">or rejected, every time</text>

        <line x1="840" y1="320" x2="900" y2="320" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Box 5: Orchestration / Execution, x 900-1060 -->
        <rect x="900" y="280" width="160" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="916" y="302" font-size="10" letter-spacing="1" fill="#88909c">ORCHESTRATION</text>
        <text x="916" y="322" font-size="11" fill="#565f6c">Restarts the monitoring</text>
        <text x="916" y="337" font-size="11" fill="#565f6c">collector — the one</text>
        <text x="916" y="352" font-size="11" fill="#565f6c">real reversible action</text>

        <!-- ============ observability & audit, below ============ -->
        <rect x="240" y="460" width="820" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="260" y="484" font-size="10" letter-spacing="1" fill="#88909c">OBSERVABILITY &amp; AUDIT</text>
        <text x="260" y="504" font-size="11" fill="#565f6c">One correlation ID, threaded through every stage above</text>

        <!-- dashed taps from each main box down to the audit bar -->
        <line x1="320" y1="360" x2="320" y2="460" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="540" y1="360" x2="540" y2="460" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="760" y1="360" x2="760" y2="460" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <line x1="980" y1="360" x2="980" y2="460" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
      </svg>
